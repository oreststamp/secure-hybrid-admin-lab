services:
  ollama:
    image: ollama/ollama
    container_name: llm_ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
      - "10.10.0.2:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: llm_webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:8080"
      - "10.10.0.2:3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - webui_data:/app/backend/data
    depends_on:
      - ollama

volumes:
  ollama_data:
  webui_data: